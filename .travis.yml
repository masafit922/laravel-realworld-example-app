language: php

php:
  - 8.3

before_script:
  - cp .env.travis .env
  - composer self-update
  - composer install --prefer-dist --no-interaction
  - php artisan key:generate
  - php artisan jwt:secret --force
  - php artisan migrate

before_install:
  - mysql -e 'CREATE DATABASE realworld_test;'

script:
  - vendor/bin/phpunit

services:
  - mysql

notifications:
  email: false
